name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  publication-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check repository structure and documentation links
        run: python scripts/check_repository.py

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "$($_.Name) contains $($errors.Count) parse error(s)."
            }
          }
          if ($failed) { exit 1 }
